<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CODISA - Sistema de Turnos</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      background: white;
      padding: 50px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,.12);
      width: 450px;
    }

    h1 {
      color: #0b4fa8;
      font-size: 40px;
      margin-bottom: 30px;
    }

    button {
      display: block;
      width: 100%;
      margin: 12px 0;
      padding: 18px;
      border-radius: 15px;
      border: none;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    .cliente { background: #0b4fa8; color: white; }
    .vendedor { background: #991b1b; color: white; }
    .pantalla { background: #111827; color: white; }
    .reset { background: #f59e0b; color: white; }

  </style>
</head>

<body>

<div class="box">
  <h1>CODISA - Turnos</h1>

  <button class="cliente" onclick="ir('cliente.html')">Cliente</button>
  <button class="vendedor" onclick="ir('vendedor.html')">Vendedor</button>
  <button class="pantalla" onclick="ir('pantalla.html')">Pantalla</button>

  <button class="reset" onclick="reiniciar()">Reiniciar día</button>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby9xvL2meItmqOR4dDCDaDyE1B5tbaCLYunNM2qUjea43JmPEQp43Nv5uV9xTG6QQHB/exec";

function ir(pagina) {
  window.location.href = pagina;
}

function reiniciar() {
  const clave = prompt("Ingrese clave para reiniciar:");

  if (clave !== "1234") {
    alert("Clave incorrecta");
    return;
  }

  if (!confirm("¿Seguro que quieres reiniciar el día?")) return;

  window.open(SCRIPT_URL + "?action=reset");

  alert("Turnos reiniciados correctamente");
}
</script>

</body>
</html>
