<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendedor - CODISA</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #0f172a;
    }

    .header {
      background: #0b4fa8;
      color: white;
      padding: 28px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 42px;
    }

    .header p {
      margin: 8px 0 0;
      font-size: 18px;
      opacity: .9;
    }

    .container {
      max-width: 900px;
      margin: 35px auto;
      padding: 25px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    label {
      font-size: 20px;
      font-weight: bold;
      color: #0b4fa8;
    }

    select {
      width: 100%;
      padding: 16px;
      margin-top: 10px;
      border: 2px solid #d1d5db;
      border-radius: 14px;
      font-size: 20px;
    }

    .buttons {
      display: flex;
      gap: 15px;
      margin-top: 22px;
    }

    button {
      flex: 1;
      padding: 18px;
      border: none;
      border-radius: 14px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #0b4fa8;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .primary:hover {
      background: #083f87;
    }

    .secondary:hover {
      background: #d1d5db;
    }

    h2 {
      color: #0b4fa8;
      font-size: 30px;
      margin-top: 0;
    }

    .ticket {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      border: 2px solid #e5e7eb;
      border-radius: 16px;
      padding: 18px 22px;
      margin: 12px 0;
    }

    .ticket-number {
      font-size: 34px;
      font-weight: bold;
      color: #991b1b;
    }

    .ticket-info {
      text-align: right;
      font-size: 20px;
      color: #374151;
    }

    .empty {
      text-align: center;
      color: #6b7280;
      font-size: 22px;
      padding: 35px;
    }

    @media (max-width: 600px) {
      .buttons {
        flex-direction: column;
      }

      .ticket {
        flex-direction: column;
        gap: 10px;
        text-align: center;
      }

      .ticket-info {
        text-align: center;
      }
    }
  </style>
</head>

<body>

<div class="header">
  <h1>Panel Vendedor</h1>
  <p>Control de turnos CODISA</p>
</div>

<div class="container">

  <div class="card">
    <label for="asesor">Selecciona asesor</label>
    <select id="asesor">
      <option value="Asesor 1">Asesor 1</option>
      <option value="Asesor 2">Asesor 2</option>
      <option value="Asesor 3">Asesor 3</option>
    </select>

    <div class="buttons">
      <button class="primary" onclick="llamarSiguiente()">Llamar siguiente turno</button>
      <button class="secondary" onclick="cargarTurnos()">Actualizar lista</button>
    </div>
  </div>

  <div class="card">
    <h2>Turnos pendientes</h2>
    <div id="lista"></div>
  </div>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzTqxANaTYQtzp2EeKIgRA53DnWw_EyOpt9rbTyT0c4o9L2Qg6uRwS9LeVW-fg_R16v/exec";

function jsonp(url) {
  return new Promise((resolve) => {
    const callback = "cb_" + Date.now();
    window[callback] = function(data) {
      resolve(data);
      delete window[callback];
      document.body.removeChild(script);
    };

    const script = document.createElement("script");
    script.src = url + "&callback=" + callback;
    document.body.appendChild(script);
  });
}

function llamarSiguiente() {
  const asesor = document.getElementById("asesor").value;

  jsonp(SCRIPT_URL + "?action=attendNext&asesor=" + encodeURIComponent(asesor))
    .then(() => cargarTurnos());
}

function cargarTurnos() {
  jsonp(SCRIPT_URL + "?action=list").then(data => {
    const pendientes = data.tickets.filter(t => t.atendido !== "true");
    const lista = document.getElementById("lista");

    if (pendientes.length === 0) {
      lista.innerHTML = `<div class="empty">No hay turnos pendientes</div>`;
      return;
    }

    lista.innerHTML = pendientes.map(t => `
      <div class="ticket">
        <div class="ticket-number">${t.turno}</div>
        <div class="ticket-info">
          <b>${t.tipo}</b><br>
          ${t.descripcion || ""}
        </div>
      </div>
    `).join("");
  });
}

cargarTurnos();
setInterval(cargarTurnos, 5000);
</script>

</body>
</html>
