<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Vendedor - CODISA</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #eef3fa;
}

/* HEADER (ÚNICO) */
.header {
  background: linear-gradient(135deg, #0b4fa8, #063b7a);
  color: white;
  padding: 25px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header h1 {
  margin: 0;
  font-size: 36px;
}

.header p {
  margin: 5px 0 0;
}

.hora {
  font-size: 24px;
  font-weight: bold;
}

/* CONTENEDOR */
.container {
  width: 92%;
  margin: 30px auto;
}

/* GRID */
.top {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

/* CARD */
.card {
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 10px 20px rgba(0,0,0,.08);
}

/* BOTONES */
button {
  padding: 15px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  cursor: pointer;
}

.primary {
  background: #0b4fa8;
  color: white;
}

.secondary {
  background: #e5e7eb;
}

/* SELECT */
select {
  width: 100%;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}

/* ESTADÍSTICAS */
.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.stat {
  padding: 20px;
  border-radius: 15px;
  text-align: center;
  color: white;
}

.blue { background: #0b4fa8; }
.red { background: #991b1b; }

.stat b {
  font-size: 40px;
}

/* LISTA */
.ticket {
  display: grid;
  grid-template-columns: 80px 1fr 120px;
  align-items: center;
  background: #f9fafb;
  padding: 15px;
  border-radius: 15px;
  margin-bottom: 10px;
}

.numero {
  font-size: 32px;
  font-weight: bold;
  color: #991b1b;
}

.info b {
  font-size: 18px;
}

.horaTicket {
  text-align: right;
  font-weight: bold;
  color: #0b4fa8;
}

.empty {
  text-align: center;
  padding: 30px;
  color: gray;
}
</style>
</head>

<body>

<!-- HEADER ÚNICO -->
<div class="header">
  <div>
    <h1>Panel Vendedor</h1>
    <p>Control de turnos CODISA MONTERREY</p>
  </div>
  <div class="hora" id="horaActual">--:--</div>
</div>

<div class="container">

  <div class="top">

    <!-- CONTROL -->
    <div class="card">
      <h2>Selecciona asesor</h2>

      <select id="asesor">
        <option>Asesor 1</option>
        <option>Asesor 2</option>
        <option>Asesor 3</option>
      </select>

      <button class="primary" onclick="siguiente()">Llamar siguiente turno</button>
      <button class="secondary" onclick="cargar()">Actualizar</button>
    </div>

    <!-- STATS -->
    <div class="stats">
      <div class="stat blue">
        <div>Pendientes</div>
        <b id="pendientes">0</b>
      </div>

      <div class="stat red">
        <div>Último</div>
        <b id="ultimo">---</b>
      </div>
    </div>

  </div>

  <!-- LISTA -->
  <div class="card">
    <h2>Turnos pendientes</h2>
    <div id="lista"></div>
  </div>

</div>

<script>
const URL = "https://script.google.com/macros/s/AKfycbzDYLpODTA6VX5PmAIWMwlpJ78bQV0wI3i8Ep28zaHHGsbaGlXONKlYNVI8nh38lMG2/exec";

/* JSONP */
function jsonp(url) {
  return new Promise(resolve => {
    const cb = "cb_" + Date.now();
    window[cb] = data => {
      resolve(data);
      delete window[cb];
      script.remove();
    };
    const script = document.createElement("script");
    script.src = url + "&callback=" + cb;
    document.body.appendChild(script);
  });
}

/* CARGAR LISTA */
function cargar() {
  jsonp(URL + "?action=list").then(data => {

    const tickets = data.tickets || [];
    const pendientes = tickets.filter(t => t.atendido !== "true");
    const atendidos = tickets.filter(t => t.atendido === "true");

    document.getElementById("pendientes").innerText = pendientes.length;

    if (atendidos.length > 0) {
      document.getElementById("ultimo").innerText =
        atendidos[atendidos.length - 1].turno;
    }

    const lista = document.getElementById("lista");

    if (pendientes.length === 0) {
      lista.innerHTML = `<div class="empty">No hay turnos</div>`;
      return;
    }

    lista.innerHTML = pendientes.map(t => {

      const hora = new Date(t.fecha).toLocaleTimeString("es-MX", {
        hour: "2-digit",
        minute: "2-digit"
      });

      return `
        <div class="ticket">
          <div class="numero">${t.turno}</div>

          <div class="info">
            <b>${t.tipo}</b><br>
            ${t.descripcion || ""}
          </div>

          <div class="horaTicket">${hora}</div>
        </div>
      `;
    }).join("");
  });
}

/* SIGUIENTE TURNO */
function siguiente() {
  const asesor = document.getElementById("asesor").value;

  jsonp(URL + "?action=attendNext&asesor=" + encodeURIComponent(asesor))
    .then(() => cargar());
}

/* RELOJ */
function reloj() {
  document.getElementById("horaActual").innerText =
    new Date().toLocaleTimeString("es-MX", {
      hour: "2-digit",
      minute: "2-digit"
    });
}

setInterval(reloj, 1000);
setInterval(cargar, 5000);

reloj();
cargar();
</script>

</body>
</html>
