<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Vendedor - CODISA</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #eef3fa;
}

/* HEADER */
.header {
  background: #1e56a0;
  color: white;
  text-align: center;
  padding: 30px;
}

.header h1 {
  margin: 0;
  font-size: 40px;
}

/* CONTENEDOR */
.container {
  width: 90%;
  margin: 30px auto;
}

/* CARD */
.card {
  background: white;
  padding: 25px;
  border-radius: 20px;
  margin-bottom: 25px;
  box-shadow: 0 10px 20px rgba(0,0,0,.08);
}

/* BOTONES */
button {
  padding: 15px 25px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
  cursor: pointer;
}

.btn-primary {
  background: #1e56a0;
  color: white;
}

.btn-secondary {
  background: #d1d5db;
}

/* LISTA */
.ticket {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 25px;
  border-radius: 15px;
  background: #f9fafb;
  margin-bottom: 12px;
}

.ticket-number {
  font-size: 28px;
  font-weight: bold;
  color: #991b1b;
  width: 60px;
}

.ticket-info {
  flex: 1;
  text-align: left;
}

.ticket-time {
  font-size: 14px;
  color: #64748b;
  font-weight: bold;
  min-width: 90px;
  text-align: right;
}

h2 {
  color: #1e56a0;
}
</style>
</head>

<body>

<div class="header">
  <h1>Panel Vendedor</h1>
  <p>Control de turnos CODISA MONTERREY</p>
</div>

<div class="container">

  <div class="card">
    <h2>Selecciona asesor</h2>

    <select id="asesor" style="width:100%;padding:15px;border-radius:10px;margin-bottom:15px;">
      <option>Asesor 1</option>
      <option>Asesor 2</option>
      <option>Asesor 3</option>
    </select>

    <button class="btn-primary" onclick="siguiente()">Llamar siguiente turno</button>
    <button class="btn-secondary" onclick="cargar()">Actualizar lista</button>
  </div>

  <div class="card">
    <h2>Turnos pendientes</h2>
    <div id="lista"></div>
  </div>

</div>

<script>
const URL = "https://script.google.com/macros/s/AKfycby9xvL2meItmqOR4dDCDaDyE1B5tbaCLYunNM2qUjea43JmPEQp43Nv5uV9xTG6QQHB/exec";

function cargar() {
  const callback = "cb_" + Date.now();

  window[callback] = function(data) {
    if(data.ok){

      const pendientes = data.tickets.filter(t => t.atendido !== "true");

      document.getElementById("lista").innerHTML = pendientes.map(t => {

        const hora = new Date(t.fecha).toLocaleTimeString("es-MX", {
          hour: "2-digit",
          minute: "2-digit"
        });

        return `
          <div class="ticket">
            <div class="ticket-number">${t.turno}</div>

            <div class="ticket-info">
              <b>${t.tipo}</b><br>
              ${t.descripcion || ""}
            </div>

            <div class="ticket-time">
              ${hora}
            </div>
          </div>
        `;
      }).join("");

    }
  };

  const script = document.createElement("script");
  script.src = URL + "?action=list&callback=" + callback;
  document.body.appendChild(script);
}

function siguiente() {
  const asesor = document.getElementById("asesor").value;
  const callback = "cb_" + Date.now();

  window[callback] = function(data) {
    cargar();
  };

  const script = document.createElement("script");
  script.src = URL + "?action=attendNext&asesor=" + asesor + "&callback=" + callback;
  document.body.appendChild(script);
}

/* AUTO ACTUALIZA CADA 5 SEGUNDOS */
setInterval(cargar, 5000);

/* PRIMER CARGA */
cargar();
</script>

</body>
</html>
