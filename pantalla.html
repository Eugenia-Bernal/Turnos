<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pantalla Turnos CODISA</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #eef3fa;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 40px;
  background: white;
}

.header h1 {
  color: #1e56a0;
  margin: 0;
}

.hora {
  font-size: 40px;
  font-weight: bold;
  color: #991b1b;
}

/* CONTENEDOR */
.container {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 20px;
  padding: 20px;
}

/* TURNO */
.turno {
  background: #f8fafc;
  border-radius: 25px;
  border: 4px solid #1e56a0;
  text-align: center;
  padding: 40px;
}

.turno h2 {
  color: #64748b;
  font-size: 40px;
}

.numero {
  font-size: 180px;
  color: #991b1b;
  font-weight: bold;
}

.asesor {
  font-size: 40px;
  color: #1e56a0;
  margin-top: 20px;
}

.tipo {
  font-size: 30px;
  color: #64748b;
}

/* LADO DERECHO */
.side {
  display: grid;
  gap: 20px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 30px;
  text-align: center;
}

.card.blue {
  background: #1e56a0;
  color: white;
}

.card.red {
  background: #991b1b;
  color: white;
}

.card h3 {
  margin: 0;
}

.card .big {
  font-size: 60px;
  font-weight: bold;
}

/* FOOTER */
.footer {
  background: #1e56a0;
  color: white;
  text-align: center;
  padding: 15px;
  font-size: 20px;
}
</style>

</head>

<body>

<!-- HEADER -->
<div class="header">
  <div>
    <h1>Sistema de Turnos</h1>
    <div>CODISA MONTERREY</div>
  </div>
  <div class="hora" id="horaActual">--:--</div>
</div>

<!-- CONTENIDO -->
<div class="container">

  <!-- TURNO -->
  <div class="turno">
    <h2>TURNO EN ATENCIÓN</h2>

    <div class="numero" id="turno">---</div>

    <div class="asesor">
      Pase con: <span id="asesor">---</span>
    </div>

    <div class="tipo" id="tipo"></div>
  </div>

  <!-- LADO DERECHO -->
  <div class="side">

    <div class="card blue">
      <h3>Turnos pendientes</h3>
      <div class="big" id="pendientes">0</div>
    </div>

    <div class="card">
      <h3>Último ticket</h3>
      <div class="big" id="ultimoTicket">--:--</div>
    </div>

    <div class="card red">
      <h3>Gracias por su visita</h3>
      <div class="big">CODISA</div>
    </div>

  </div>

</div>

<!-- FOOTER -->
<div class="footer">
  Bienvenido a CODISA MONTERREY • Espere su turno
</div>

<script>
const URL = "https://script.google.com/macros/s/AKfycby9xvL2meItmqOR4dDCDaDyE1B5tbaCLYunNM2qUjea43JmPEQp43Nv5uV9xTG6QQHB/exec";

/* JSONP */
function jsonp(url) {
  return new Promise(resolve => {
    const cb = "cb_" + Date.now();

    window[cb] = function(data) {
      resolve(data);
      delete window[cb];
      script.remove();
    };

    const script = document.createElement("script");
    script.src = url + "&callback=" + cb;
    document.body.appendChild(script);
  });
}

/* CARGAR DATOS */
function cargar() {
  jsonp(URL + "?action=list").then(data => {

    const tickets = data.tickets || [];

    const atendidos = tickets.filter(t => t.atendido === "true");
    const pendientes = tickets.filter(t => t.atendido !== "true");

    const ultimo = atendidos[atendidos.length - 1];

    if (ultimo) {
      document.getElementById("turno").innerText = ultimo.turno;
      document.getElementById("tipo").innerText = ultimo.tipo;
      document.getElementById("asesor").innerText = ultimo.asesor || "---";

      const hora = new Date(ultimo.horaAtencion).toLocaleTimeString("es-MX", {
        hour: "2-digit",
        minute: "2-digit"
      });

      document.getElementById("ultimoTicket").innerText = hora;
    }

    document.getElementById("pendientes").innerText = pendientes.length;
  });
}

/* RELOJ */
function reloj() {
  document.getElementById("horaActual").innerText =
    new Date().toLocaleTimeString("es-MX", {
      hour: "2-digit",
      minute: "2-digit"
    });
}

/* AUTO */
setInterval(cargar, 5000);
setInterval(reloj, 1000);

cargar();
reloj();
</script>

</body>
</html>
