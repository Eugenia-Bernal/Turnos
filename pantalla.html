<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pantalla Turnos</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
}

.header {
  display: flex;
  align-items: center;
  padding: 15px 30px;
}

.header img {
  width: 80px;
  margin-right: 15px;
}

.container {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap: 20px;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 25px;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,.1);
}

.turno {
  border: 4px solid #0b4fa8;
  text-align: center;
}

.turno h1 {
  font-size: 40px;
  color: #6b7280;
}

.numero {
  font-size: 120px;
  color: #991b1b;
  font-weight: bold;
}

.asesor {
  font-size: 30px;
  color: #0b4fa8;
}

.promo img {
  width: 100%;
  border-radius: 20px;
}

.right {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.blue {
  background: #0b4fa8;
  color: white;
  text-align: center;
  padding: 30px;
  border-radius: 20px;
}

.red {
  background: #991b1b;
  color: white;
  text-align: center;
  padding: 30px;
  border-radius: 20px;
}
</style>
</head>

<body>

<div class="header">
  <img src="LOGO.png">
  <div>
    <h2>Sistema de Turnos</h2>
    <small>Pantalla pública de atención</small>
  </div>
</div>

<div class="container">

  <!-- TURNO -->
  <div class="card turno">
    <h1>TURNO EN ATENCIÓN</h1>
    <div class="numero" id="turno">---</div>
    <div class="asesor" id="asesor">Pase con: ---</div>
  </div>

  <!-- PROMO -->
  <div class="card promo">
    <img id="promo" src="promo1.png">
  </div>

  <!-- DERECHA -->
  <div class="right">

    <div class="blue">
      <h3>Turnos pendientes</h3>
      <h1 id="pendientes">0</h1>
    </div>

    <div class="card">
      <h3>Último ticket</h3>
      <h2 id="hora">--:--</h2>
    </div>

    <div class="red">
      <h2>Gracias por su visita</h2>
      <h1>CODISA</h1>
    </div>

  </div>

</div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby9xvL2meItmqOR4dDCDaDyE1B5tbaCLYunNM2qUjea43JmPEQp43Nv5uV9xTG6QQHB/exec";

/* =========================
   CARGAR TURNOS
========================= */
function cargarPantalla() {
  fetch(SCRIPT_URL + "?action=list")
    .then(r => r.text())
    .then(data => {
      const json = JSON.parse(data.replace(/^[^(]+\(/, '').replace(/\)$/, ''));
      const tickets = json.tickets || [];

      let atendido = tickets.filter(t => t.atendido === "true").pop();
      let pendientes = tickets.filter(t => t.atendido !== "true");

      document.getElementById("pendientes").innerText = pendientes.length;

      if (atendido) {
        document.getElementById("turno").innerText = atendido.turno;
        document.getElementById("asesor").innerText = "Pase con: " + (atendido.asesor || "---");

        let fecha = new Date(atendido.horaAtencion);
        document.getElementById("hora").innerText = fecha.toLocaleTimeString();
      }
    });
}

/* =========================
   PROMOS AUTOMATICAS
========================= */
let imagenActual = 0;

const imagenes = [
  "promo1.png",
  "promo2.png"
];

function cambiarImagen() {
  imagenActual++;
  if (imagenActual >= imagenes.length) imagenActual = 0;

  document.getElementById("promo").src = imagenes[imagenActual];
}

/* =========================
   INTERVALOS
========================= */
cargarPantalla();

setInterval(cargarPantalla, 2000); // actualiza turnos
setInterval(cambiarImagen, 5000);  // cambia promo

</script>

</body>
</html>
