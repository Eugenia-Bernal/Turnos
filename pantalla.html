<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantalla - Turnos CODISA</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eaf2ff, #ffffff);
      height: 100vh;
      overflow: hidden;
      color: #0b4fa8;
    }

    .header {
      height: 90px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 35px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      border: 2px solid #0b4fa8;
      border-radius: 14px;
      background: white;
      padding: 5px;
    }

    .brand h1 {
      margin: 0;
      font-size: 34px;
      color: #0b4fa8;
    }

    .brand p {
      margin: 2px 0 0;
      font-size: 17px;
      color: #64748b;
    }

    .reloj {
      font-size: 34px;
      font-weight: 900;
      color: #991b1b;
    }

    .main {
      height: calc(100vh - 140px);
      padding: 25px;
      display: grid;
      grid-template-columns: 1.45fr .9fr .65fr;
      gap: 24px;
    }

    .panel {
      background: white;
      border-radius: 30px;
      box-shadow: 0 15px 35px rgba(0,0,0,.10);
    }

    .turno-box {
      border: 5px solid #0b4fa8;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .label {
      font-size: 42px;
      font-weight: 900;
      color: #64748b;
      letter-spacing: 2px;
    }

    .turno {
      font-size: 260px;
      line-height: 1;
      font-weight: 900;
      color: #991b1b;
      margin: 18px 0;
      transition: .25s;
    }

    .turno.animar {
      transform: scale(1.15);
      color: #dc2626;
    }

    .asesor {
      font-size: 56px;
      font-weight: 900;
      color: #0b4fa8;
      text-align: center;
    }

    .servicio {
      margin-top: 15px;
      font-size: 34px;
      font-weight: bold;
      color: #334155;
    }

    .historial {
      margin-top: 35px;
      font-size: 24px;
      color: #64748b;
      text-align: center;
    }

    .historial b {
      color: #0b4fa8;
    }

    .image-box {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 35px;
      border: 3px solid #dbeafe;
    }

    .image-box img {
      width: 100%;
      max-height: 80vh;
      object-fit: contain;
    }

    .side {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .side-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      padding: 25px;
    }

    .side-card.blue {
      background: #0b4fa8;
      color: white;
    }

    .side-card.red {
      background: #991b1b;
      color: white;
    }

    .side-card.white {
      background: white;
      color: #0b4fa8;
    }

    .side-card span {
      font-size: 25px;
      font-weight: bold;
    }

    .side-card b {
      font-size: 72px;
      margin-top: 10px;
    }

    .side-card.white b {
      font-size: 52px;
    }

    .marquee {
      height: 50px;
      background: #0b4fa8;
      color: white;
      display: flex;
      align-items: center;
      overflow: hidden;
      font-size: 28px;
      font-weight: bold;
      white-space: nowrap;
    }

    .marquee span {
      display: inline-block;
      padding-left: 100%;
      animation: mover 22s linear infinite;
    }

    @keyframes mover {
      from { transform: translateX(0); }
      to { transform: translateX(-100%); }
    }

    .audio-btn {
      position: fixed;
      right: 20px;
      bottom: 65px;
      background: #991b1b;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px 20px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>

<body>

<button class="audio-btn" onclick="activarAudio()">Activar sonido</button>

<div class="header">
  <div class="brand">
    <img src="logo.png" alt="CODISA">
    <div>
      <h1>Sistema de Turnos</h1>
      <p>Pantalla pública de atención</p>
    </div>
  </div>

  <div class="reloj" id="reloj">--:--</div>
</div>

<div class="main">

  <div class="panel turno-box">
    <div class="label">TURNO EN ATENCIÓN</div>
    <div class="turno" id="turnoActual">---</div>
    <div class="asesor" id="asesorActual">Pase con: ---</div>
    <div class="servicio" id="servicioActual"></div>
    <div class="historial" id="historial"></div>
  </div>

  <div class="panel image-box">
    <img id="imagenPromo" src="logo.png" alt="CODISA">
  </div>

  <div class="side">
    <div class="panel side-card blue">
      <span>Turnos pendientes</span>
      <b id="pendientes">0</b>
    </div>

    <div class="panel side-card white">
      <span>Último ticket</span>
      <b id="hora">---</b>
    </div>

    <div class="panel side-card red">
      <span>Gracias por su visita</span>
      <b>CODISA</b>
    </div>
  </div>

</div>

<div class="marquee">
  <span>Bienvenido a CODISA • Espere su turno • Tenga listo su pedido • Gracias por su preferencia •</span>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzQO4L8XprFWZTVfRcUZuol95NFa5MOKvZP9_EUY8bFTFx0NArHq-dTbViVSP-f-qI8/exec";

let ultimoTurno = "";
let audioActivo = false;

const imagenes = ["const imagenes = ["logo.png", "promo1.png", "promo2.png"];
let imagenIndex = 0;

function activarAudio() {
  audioActivo = true;
  hablar("Sonido activado");
  document.querySelector(".audio-btn").style.display = "none";
}

function beep() {
  if (!audioActivo) return;

  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.frequency.value = 880;
  gain.gain.value = 0.18;

  osc.start();
  setTimeout(() => {
    osc.stop();
    ctx.close();
  }, 350);
}

function hablar(texto) {
  if (!audioActivo) return;

  speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(texto);
  msg.lang = "es-MX";
  msg.rate = 0.9;
  speechSynthesis.speak(msg);
}

function jsonp(url) {
  return new Promise((resolve) => {
    const callback = "cb_" + Date.now();

    window[callback] = function(data) {
      resolve(data);
      delete window[callback];
      document.body.removeChild(script);
    };

    const script = document.createElement("script");
    script.src = url + "&callback=" + callback;
    document.body.appendChild(script);
  });
}

function cargarPantalla() {
  jsonp(SCRIPT_URL + "?action=list").then(data => {
    const tickets = data.tickets || [];
    const atendidos = tickets.filter(t => t.atendido === "true");
    const ultimo = atendidos[atendidos.length - 1];

    if (ultimo) {
      const turno = ultimo.turno;
      const asesor = ultimo.asesor || "---";
      const tipo = ultimo.tipo || "";

      document.getElementById("turnoActual").innerText = turno;
      document.getElementById("asesorActual").innerText = "Pase con: " + asesor;
      document.getElementById("servicioActual").innerText = tipo;

      document.getElementById("hora").innerText =
        new Date(ultimo.horaAtencion).toLocaleTimeString("es-MX", {
          hour: "2-digit",
          minute: "2-digit"
        });

      if (ultimoTurno !== turno) {
        ultimoTurno = turno;

        const el = document.getElementById("turnoActual");
        el.classList.add("animar");
        setTimeout(() => el.classList.remove("animar"), 500);

        beep();
        setTimeout(() => {
          hablar("Turno " + turno + ", pase con " + asesor);
        }, 450);
      }
    }

    document.getElementById("pendientes").innerText =
      tickets.filter(t => t.atendido !== "true").length;

    const ultimos = atendidos.slice(-5).reverse();
    document.getElementById("historial").innerHTML =
      ultimos.length
        ? "Últimos llamados: " + ultimos.map(t => "<b>" + t.turno + "</b>").join(" • ")
        : "";
  });
}

function actualizarReloj() {
  document.getElementById("reloj").innerText =
    new Date().toLocaleTimeString("es-MX", {
      hour: "2-digit",
      minute: "2-digit"
    });
}

function cambiarImagen() {
  if (imagenes.length <= 1) return;

  imagenIndex = (imagenIndex + 1) % imagenes.length;
  document.getElementById("imagenPromo").src = imagenes[imagenIndex];
}

actualizarReloj();
cargarPantalla();

setInterval(actualizarReloj, 1000);
setInterval(cargarPantalla, 5000);
setInterval(cambiarImagen, 10000);
</script>

</body>
</html>
