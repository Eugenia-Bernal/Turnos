<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pantalla - CODISA</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef3fa;
  height: 100vh;
  overflow: hidden;
}

.header {
  height: 85px;
  background: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 35px;
  box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.brand {
  display: flex;
  align-items: center;
  gap: 15px;
}

.brand img {
  width: 65px;
  height: 65px;
  object-fit: contain;
  border: 2px solid #0b4fa8;
  border-radius: 12px;
  padding: 4px;
}

.brand h1 {
  margin: 0;
  color: #0b4fa8;
  font-size: 32px;
}

.brand p {
  margin: 3px 0 0;
  color: #64748b;
  font-size: 16px;
}

.reloj {
  color: #991b1b;
  font-size: 36px;
  font-weight: bold;
}

.main {
  height: calc(100vh - 135px);
  padding: 22px;
  display: grid;
  grid-template-columns: 1.35fr .8fr .65fr;
  gap: 22px;
}

.panel {
  background: white;
  border-radius: 24px;
  box-shadow: 0 12px 30px rgba(0,0,0,.10);
}

.turno-box {
  border: 5px solid #0b4fa8;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.label {
  font-size: 40px;
  font-weight: 900;
  color: #64748b;
  letter-spacing: 2px;
}

.turno {
  font-size: 210px;
  line-height: 1;
  font-weight: 900;
  color: #991b1b;
  margin: 25px 0;
}

.asesor {
  font-size: 52px;
  font-weight: 900;
  color: #0b4fa8;
}

.tipo {
  font-size: 34px;
  font-weight: bold;
  margin-top: 18px;
  color: #334155;
}

.image-box {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
  border: 3px solid #dbeafe;
}

.image-box img {
  width: 100%;
  max-height: 75vh;
  object-fit: contain;
}

.side {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.side-card {
  flex: 1;
  border-radius: 24px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: center;
}

.blue {
  background: #0b4fa8;
  color: white;
}

.white {
  background: white;
  color: #0b4fa8;
}

.red {
  background: #991b1b;
  color: white;
}

.side-card span {
  font-size: 24px;
  font-weight: bold;
}

.side-card b {
  font-size: 64px;
  margin-top: 10px;
}

.marquee {
  height: 50px;
  background: #0b4fa8;
  color: white;
  font-size: 26px;
  font-weight: bold;
  display: flex;
  align-items: center;
  overflow: hidden;
  white-space: nowrap;
}

.marquee span {
  display: inline-block;
  padding-left: 100%;
  animation: mover 22s linear infinite;
}

@keyframes mover {
  from { transform: translateX(0); }
  to { transform: translateX(-100%); }
}
</style>
</head>

<body>

<div class="header">
  <div class="brand">
    <img src="LOGO.png" alt="CODISA">
    <div>
      <h1>Sistema de Turnos</h1>
      <p>Pantalla pública de atención</p>
    </div>
  </div>

  <div class="reloj" id="reloj">--:--</div>
</div>

<div class="main">

  <div class="panel turno-box">
    <div class="label">TURNO EN ATENCIÓN</div>
    <div class="turno" id="turnoActual">---</div>
    <div class="asesor">Pase con: <span id="asesorActual">---</span></div>
    <div class="tipo" id="tipoActual"></div>
  </div>

  <div class="panel image-box">
    <img id="promo" src="promo1.png" alt="Promoción">
  </div>

  <div class="side">
    <div class="side-card blue">
      <span>Turnos pendientes</span>
      <b id="pendientes">0</b>
    </div>

    <div class="side-card white">
      <span>Último ticket</span>
      <b id="horaUltimo">---</b>
    </div>

    <div class="side-card red">
      <span>Gracias por su visita</span>
      <b>CODISA</b>
    </div>
  </div>

</div>

<div class="marquee">
  <span>Bienvenido a CODISA MONTERREY • Espere su turno • Tenga listo su pedido • Gracias por su preferencia •</span>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzDYLpODTA6VX5PmAIWMwlpJ78bQV0wI3i8Ep28zaHHGsbaGlXONKlYNVI8nh38lMG2/exec";

let imagenActual = 0;
const imagenes = ["promo1.png", "promo2.png"];

function jsonp(url) {
  return new Promise(resolve => {
    const callback = "cb_" + Date.now();

    window[callback] = function(data) {
      resolve(data);
      delete window[callback];
      document.body.removeChild(script);
    };

    const script = document.createElement("script");
    script.src = url + "&callback=" + callback;
    document.body.appendChild(script);
  });
}

function cargarPantalla() {
  jsonp(SCRIPT_URL + "?action=list").then(data => {
    const tickets = data.tickets || [];

    const atendidos = tickets.filter(t => String(t.atendido).toLowerCase() === "true");
    const pendientes = tickets.filter(t => String(t.atendido).toLowerCase() !== "true");

    const ultimo = atendidos[atendidos.length - 1];

    document.getElementById("pendientes").innerText = pendientes.length;

    if (ultimo) {
      document.getElementById("turnoActual").innerText = ultimo.turno || "---";
      document.getElementById("asesorActual").innerText = ultimo.asesor && ultimo.asesor.trim() !== "" ? ultimo.asesor : "---";
      document.getElementById("tipoActual").innerText = ultimo.tipo || "";

      if (ultimo.horaAtencion) {
        document.getElementById("horaUltimo").innerText =
          new Date(ultimo.horaAtencion).toLocaleTimeString("es-MX", {
            hour: "2-digit",
            minute: "2-digit"
          });
      }
    }
  });
}

function actualizarReloj() {
  document.getElementById("reloj").innerText =
    new Date().toLocaleTimeString("es-MX", {
      hour: "2-digit",
      minute: "2-digit"
    });
}

function cambiarImagen() {
  imagenActual = (imagenActual + 1) % imagenes.length;
  document.getElementById("promo").src = imagenes[imagenActual];
}

actualizarReloj();
cargarPantalla();

setInterval(actualizarReloj, 1000);
setInterval(cargarPantalla, 2000);
setInterval(cambiarImagen, 5000);
</script>

</body>
</html>
