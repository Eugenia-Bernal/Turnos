<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cliente - Turnos CODISA</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
}

.header {
  display: flex;
  align-items: center;
  padding: 20px 30px;
  background: white;
  box-shadow: 0 4px 12px rgba(0,0,0,.08);
}

.logo {
  width: 90px;
  height: 90px;
  border: 3px solid #0b4fa8;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 20px;
}

.logo img {
  width: 70px;
}

.title h1 {
  margin: 0;
  color: #0b4fa8;
}

.title p {
  margin: 0;
  color: #6b7280;
}

.container {
  background: white;
  margin: 30px auto;
  width: 95%;
  padding: 40px;
  border-radius: 20px;
  text-align: center;
}

h2 {
  font-size: 50px;
  color: #0b4fa8;
}

.sub {
  color: #6b7280;
  margin-bottom: 30px;
}

.cards {
  display: flex;
  justify-content: center;
  gap: 25px;
  flex-wrap: wrap;
}

.card {
  width: 250px;
  padding: 30px;
  border-radius: 20px;
  background: #f9fafb;
  cursor: pointer;
  transition: .3s;
}

.card:hover {
  transform: translateY(-8px);
  box-shadow: 0 15px 30px rgba(0,0,0,.1);
}

.card h3 {
  color: #991b1b;
  font-size: 28px;
}

.form {
  margin-top: 30px;
  display: none;
}

input {
  padding: 14px;
  margin: 10px;
  width: 280px;
  border-radius: 10px;
  border: 2px solid #ccc;
  font-size: 16px;
}

button {
  padding: 14px 25px;
  border: none;
  border-radius: 10px;
  background: #0b4fa8;
  color: white;
  font-size: 16px;
  cursor: pointer;
  font-weight: bold;
}

.ticket {
  margin: 25px auto;
  padding: 20px;
  max-width: 300px;
  border: 2px dashed #0b4fa8;
  border-radius: 15px;
  background: white;
}

.ticket-num {
  font-size: 70px;
  color: #991b1b;
  font-weight: bold;
}

.print-btn {
  background: #991b1b;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">
    <img src="LOGO.png" alt="CODISA">
  </div>
  <div class="title">
    <h1>Sistema de Turnos</h1>
    <p>Registro rápido para clientes</p>
  </div>
</div>

<div class="container">

<h2>Bienvenido/a</h2>
<p class="sub">Selecciona el tipo de atención</p>

<div class="cards">
  <div class="card" onclick="seleccionar('Mayoreo','Más de 12 piezas')">
    <h3>Mayoreo</h3>
    <p>Más de 12 piezas</p>
  </div>

  <div class="card" onclick="seleccionar('Menudeo','11 piezas o menos')">
    <h3>Menudeo</h3>
    <p>11 piezas o menos</p>
  </div>

  <div class="card" onclick="seleccionar('Modificar','Modificar pedido')">
    <h3>Modificar</h3>
    <p>Modificar pedido</p>
  </div>
</div>

<div class="form" id="formulario" autocomplete="off">

<h3 id="tipoSel"></h3>

<input id="nombre" name="nombre_codisa" placeholder="Nombre completo" autocomplete="off"><br>
<input id="whatsapp" name="whatsapp_codisa" placeholder="WhatsApp" autocomplete="off" inputmode="numeric"><br>

<button onclick="crearTurno()">Generar Turno</button>

<div id="respuesta"></div>

</div>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby9xvL2meItmqOR4dDCDaDyE1B5tbaCLYunNM2qUjea43JmPEQp43Nv5uV9xTG6QQHB/exec";

let tipo = "";
let descripcion = "";
let ticketHTML = "";

function seleccionar(t, d){
  tipo = t;
  descripcion = d;
  document.getElementById("formulario").style.display = "block";
  document.getElementById("tipoSel").innerText = t + " - " + d;
  document.getElementById("respuesta").innerHTML = "";
}

function crearTurno(){
  const nombre = document.getElementById("nombre").value.trim();
  const whatsapp = document.getElementById("whatsapp").value.trim();

  if(!tipo){
    alert("Selecciona un tipo de atención");
    return;
  }

  if(!nombre || !whatsapp){
    alert("Completa nombre y WhatsApp");
    return;
  }

  const callback = "cb_" + Date.now();

  window[callback] = function(data){
    if(data.ok){
      const fecha = new Date().toLocaleString("es-MX");

      ticketHTML = `
        <div class="ticket">
          <img src="LOGO.png" width="70"><br>
          <b>CODISA</b>
          <p>Tu turno</p>
          <div class="ticket-num">${data.ticket.turno}</div>
          <p><b>${data.ticket.tipo}</b></p>
          <p>${data.ticket.descripcion || descripcion}</p>
          <p>${fecha}</p>
          <p>Espere a que su turno aparezca en pantalla.</p>
          <button class="print-btn" onclick="imprimir()">Imprimir</button>
        </div>
      `;

      document.getElementById("respuesta").innerHTML = ticketHTML;

      document.getElementById("nombre").value = "";
      document.getElementById("whatsapp").value = "";

      imprimir();
    } else {
      document.getElementById("respuesta").innerText = "Error: " + data.error;
    }

    delete window[callback];
    document.body.removeChild(script);
  };

  const script = document.createElement("script");

  script.src = SCRIPT_URL
    + "?action=create"
    + "&cliente=" + encodeURIComponent(nombre)
    + "&whatsapp=" + encodeURIComponent(whatsapp)
    + "&tipo=" + encodeURIComponent(tipo)
    + "&descripcion=" + encodeURIComponent(descripcion)
    + "&callback=" + callback;

  document.body.appendChild(script);
}

function imprimir(){
  const w = window.open("", "", "width=320,height=500");

  w.document.write(`
    <html>
    <head>
      <title>Ticket CODISA</title>
      <style>
        body {
          font-family: Arial, sans-serif;
          text-align: center;
          margin: 0;
          padding: 12px;
        }

        .ticket {
          width: 260px;
          margin: auto;
          border: 2px dashed #000;
          padding: 15px;
        }

        img {
          width: 70px;
          margin-bottom: 5px;
        }

        .ticket-num {
          font-size: 64px;
          font-weight: bold;
          margin: 8px 0;
        }

        button {
          display: none;
        }

        p {
          margin: 6px 0;
          font-size: 13px;
        }
      </style>
    </head>
    <body onload="window.print(); setTimeout(() => window.close(), 500);">
      ${ticketHTML}
    </body>
    </html>
  `);

  w.document.close();
}
</script>

</body>
</html>
