<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cliente - Turnos CODISA MONTERREY</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f4f7fb;
}

.header {
  display: flex;
  align-items: center;
  padding: 20px 30px;
  background: white;
  box-shadow: 0 4px 10px rgba(0,0,0,.1);
}

.logo {
  width: 90px;
  height: 90px;
  border: 3px solid #0b4fa8;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 20px;
}

.logo img {
  width: 70px;
}

.title h1 {
  margin: 0;
  color: #0b4fa8;
}

.title p {
  margin: 0;
  color: #6b7280;
}

.container {
  background: white;
  margin: 30px auto;
  width: 90%;
  padding: 40px;
  border-radius: 20px;
  text-align: center;
}

h2 {
  font-size: 45px;
  color: #0b4fa8;
}

.cards {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 30px;
  flex-wrap: wrap;
}

.card {
  padding: 25px;
  width: 220px;
  border-radius: 15px;
  background: #f9fafb;
  cursor: pointer;
  transition: .3s;
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 20px rgba(0,0,0,.1);
}

.card h3 {
  color: #991b1b;
}

.form {
  margin-top: 30px;
  display: none;
}

input {
  padding: 12px;
  margin: 10px;
  width: 260px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 16px;
}

button {
  padding: 12px 20px;
  border-radius: 10px;
  border: none;
  background: #0b4fa8;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

#respuesta {
  margin-top: 15px;
  font-weight: bold;
  color: green;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">
    <img src="LOGO.png">
  </div>
  <div class="title">
    <h1>Sistema de Turnos</h1>
    <p>CODISA MONTERREY</p>
  </div>
</div>

<div class="container">

<h2>Bienvenido/a a <span style="color:#991b1b;">CODISA MONTERREY</span></h2>
<p>Selecciona el tipo de atención que necesitas</p>

<div class="cards">
  <div class="card" onclick="seleccionar('Mayoreo','Más de 12 piezas')">
    <h3>Mayoreo</h3>
    <p>Más de 12 piezas</p>
  </div>

  <div class="card" onclick="seleccionar('Menudeo','11 piezas o menos')">
    <h3>Menudeo</h3>
    <p>11 piezas o menos</p>
  </div>

  <div class="card" onclick="seleccionar('Modificar','Modificar pedido')">
    <h3>Modificar</h3>
    <p>Modificar pedido</p>
  </div>
</div>

<div class="form" id="formulario">

<h3 id="tipoSel"></h3>

<input id="nombre" placeholder="Nombre completo"><br>
<input id="whatsapp" placeholder="WhatsApp"><br>

<button onclick="crearTurno()">Generar Turno</button>

<p id="respuesta"></p>

</div>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby9xvL2meItmqOR4dDCDaDyE1B5tbaCLYunNM2qUjea43JmPEQp43Nv5uV9xTG6QQHB/exec";

let tipo = "";
let descripcion = "";
let ticketHTML = "";

function seleccionar(t, d){
  tipo = t;
  descripcion = d;

  document.getElementById("formulario").style.display = "block";
  document.getElementById("tipoSel").innerText = t + " - " + d;
}

function crearTurno(){
  const nombre = document.getElementById("nombre").value;
  const whatsapp = document.getElementById("whatsapp").value;

  if(!nombre || !whatsapp){
    alert("Completa todos los campos");
    return;
  }

  const callback = "cb_" + Date.now();

  window[callback] = function(data){
    if(data.ok){

      const fecha = new Date().toLocaleString("es-MX");

      ticketHTML = `
        <div style="text-align:center;font-family:Arial;">
          <img src="LOGO.png" width="70"><br>
          <b>CODISA MONTERREY</b>
          <p>Tu turno</p>
          <div style="font-size:60px;font-weight:bold;">${data.ticket.turno}</div>
          <p><b>${data.ticket.tipo}</b></p>
          <p>${descripcion}</p>
          <p>${fecha}</p>
          <p>Espere a que su turno aparezca en pantalla</p>
        </div>
      `;

      document.getElementById("respuesta").innerText = "Turno generado correctamente";

      document.getElementById("nombre").value = "";
      document.getElementById("whatsapp").value = "";

      imprimir();
    }

    delete window[callback];
    document.body.removeChild(script);
  };

  const script = document.createElement("script");

  script.src = SCRIPT_URL
    + "?action=create"
    + "&cliente=" + encodeURIComponent(nombre)
    + "&whatsapp=" + encodeURIComponent(whatsapp)
    + "&tipo=" + encodeURIComponent(tipo)
    + "&descripcion=" + encodeURIComponent(descripcion)
    + "&callback=" + callback;

  document.body.appendChild(script);
}

function imprimir(){
  const w = window.open("", "", "width=300,height=400");

  w.document.write(`
    <html>
    <body onload="window.print();window.close();">
    ${ticketHTML}
    </body>
    </html>
  `);

  w.document.close();
}
</script>

</body>
</html>
