<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cliente - Turnos CODISA</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
    }

    .header {
      display: flex;
      align-items: center;
      padding: 15px 30px;
      background: white;
      box-shadow: 0 4px 10px rgba(0,0,0,.08);
    }

    .logo img {
      width: 70px;
      background: white;
      padding: 6px;
      border-radius: 12px;
      border: 2px solid #0b4fa8;
      margin-right: 15px;
    }

    .title h1 {
      margin: 0;
      color: #0b4fa8;
    }

    .title p {
      margin: 0;
      color: #6b7280;
    }

    .container {
      padding: 40px;
      text-align: center;
    }

    h2 {
      font-size: 40px;
      color: #0b4fa8;
    }

    .cards {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 35px;
      flex-wrap: wrap;
    }

    .card {
      width: 250px;
      padding: 30px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 10px 25px rgba(0,0,0,.1);
      cursor: pointer;
      transition: .3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card h3 {
      color: #991b1b;
      font-size: 28px;
    }

    .card p {
      color: #6b7280;
    }

    .form {
      margin-top: 35px;
      display: none;
    }

    input {
      padding: 14px;
      margin: 10px;
      width: 280px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      padding: 14px 28px;
      border: none;
      border-radius: 10px;
      background: #0b4fa8;
      color: white;
      font-size: 18px;
      cursor: pointer;
      font-weight: bold;
    }

    .ticket {
      margin: 30px auto;
      padding: 25px;
      max-width: 340px;
      background: white;
      border: 3px dashed #0b4fa8;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,.12);
    }

    .ticket img {
      width: 90px;
      margin-bottom: 10px;
    }

    .ticket h3 {
      margin: 5px 0;
      color: #0b4fa8;
    }

    .ticket-numero {
      font-size: 76px;
      font-weight: bold;
      color: #991b1b;
      margin: 10px 0;
    }

    .print-btn {
      background: #991b1b;
      margin-top: 12px;
    }
  </style>
</head>

<body>

<div class="header">
  <div class="logo">
    <img src="LOGO.png" alt="CODISA">
  </div>

  <div class="title">
    <h1>Sistema de Turnos</h1>
    <p>Registro rápido para clientes</p>
  </div>
</div>

<div class="container">

  <h2>Bienvenido/a</h2>
  <p>Selecciona el tipo de atención que necesitas.</p>

  <div class="cards">
    <div class="card" onclick="seleccionar('Mayoreo', 'Más de 12 piezas')">
      <h3>Mayoreo</h3>
      <p>Más de 12 piezas</p>
    </div>

    <div class="card" onclick="seleccionar('Menudeo', '11 piezas o menos')">
      <h3>Menudeo</h3>
      <p>11 piezas o menos</p>
    </div>

    <div class="card" onclick="seleccionar('Modificar', 'Modificar pedido')">
      <h3>Modificar</h3>
      <p>Modificar pedido</p>
    </div>
  </div>

  <div class="form" id="formulario">
    <h3 id="tipoSeleccionado"></h3>

    <input id="nombre" placeholder="Nombre completo"><br>
    <input id="whatsapp" placeholder="WhatsApp"><br>

    <button onclick="crearTurno()">Generar Turno</button>

    <div id="respuesta"></div>
  </div>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby9xvL2meItmqOR4dDCDaDyE1B5tbaCLYunNM2qUjea43JmPEQp43Nv5uV9xTG6QQHB/exec";

let tipo = "";
let descripcion = "";
let ultimoTicketHTML = "";

function seleccionar(t, d) {
  tipo = t;
  descripcion = d;

  document.getElementById("formulario").style.display = "block";
  document.getElementById("tipoSeleccionado").innerText = t + " - " + d;
  document.getElementById("respuesta").innerHTML = "";
}

function crearTurno() {
  const nombre = document.getElementById("nombre").value.trim();
  const whatsapp = document.getElementById("whatsapp").value.trim();

  if (!tipo) {
    document.getElementById("respuesta").innerText = "Selecciona un servicio";
    return;
  }

  if (!nombre || !whatsapp) {
    document.getElementById("respuesta").innerText = "Escribe nombre y WhatsApp";
    return;
  }

  const callback = "cb_" + Date.now();

  window[callback] = function(data) {
    if (data.ok) {
      const fecha = new Date().toLocaleString("es-MX");

      ultimoTicketHTML = `
        <div class="ticket">
          <img src="LOGO.png" alt="CODISA">
          <h3>CODISA</h3>
          <p>Tu turno es</p>
          <div class="ticket-numero">${data.ticket.turno}</div>
          <p><b>Servicio:</b> ${data.ticket.tipo}</p>
          <p><b>Descripción:</b> ${data.ticket.descripcion || descripcion}</p>
          <p><b>Fecha:</b> ${fecha}</p>
          <p>Espere a que su turno aparezca en pantalla.</p>
          <button class="print-btn" onclick="imprimirTicket()">Imprimir ticket</button>
        </div>
      `;

      document.getElementById("respuesta").innerHTML = ultimoTicketHTML;

      document.getElementById("nombre").value = "";
      document.getElementById("whatsapp").value = "";
    } else {
      document.getElementById("respuesta").innerText = "Error: " + data.error;
    }

    delete window[callback];
    document.body.removeChild(script);
  };

  const script = document.createElement("script");
  script.src = SCRIPT_URL
    + "?action=create"
    + "&cliente=" + encodeURIComponent(nombre)
    + "&whatsapp=" + encodeURIComponent(whatsapp)
    + "&tipo=" + encodeURIComponent(tipo)
    + "&descripcion=" + encodeURIComponent(descripcion)
    + "&callback=" + callback;

  document.body.appendChild(script);
}

function imprimirTicket() {
  const win = window.open("", "", "width=360,height=520");

  win.document.write(`
    <html>
    <head>
      <title>Ticket CODISA</title>
      <style>
        body {
          font-family: Arial, sans-serif;
          text-align: center;
          margin: 0;
          padding: 15px;
        }

        .ticket {
          width: 260px;
          margin: auto;
          border: 2px dashed #000;
          padding: 15px;
        }

        img {
          width: 80px;
          margin-bottom: 5px;
        }

        h3 {
          margin: 5px 0;
        }

        .ticket-numero {
          font-size: 64px;
          font-weight: bold;
          margin: 8px 0;
        }

        button {
          display: none;
        }

        p {
          margin: 6px 0;
          font-size: 13px;
        }
      </style>
    </head>
    <body onload="window.print();">
      ${ultimoTicketHTML}
    </body>
    </html>
  `);

  win.document.close();
}
</script>

</body>
</html>
