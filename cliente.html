<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cliente - CODISA MONTERREY</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef3fa;
}

.header {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 18px 35px;
  background: white;
  box-shadow: 0 5px 18px rgba(0,0,0,.10);
}

.logo-box {
  width: 92px;
  height: 92px;
  border: 3px solid #0b4fa8;
  border-radius: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.logo-box img {
  width: 72px;
}

.header h1 {
  margin: 0;
  font-size: 40px;
  color: #0b4fa8;
}

.header p {
  margin: 4px 0 0;
  font-size: 20px;
  color: #64748b;
}

.container {
  width: 94%;
  margin: 35px auto;
  background: white;
  border-radius: 28px;
  padding: 55px 40px;
  box-shadow: 0 12px 35px rgba(0,0,0,.08);
  text-align: center;
}

h2 {
  font-size: 56px;
  margin: 0;
  color: #0b4fa8;
}

h2 span {
  color: #991b1b;
}

.subtitle {
  font-size: 24px;
  color: #64748b;
  margin: 16px 0 45px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 30px;
}

.card {
  background: white;
  border: 3px solid #dbe3ef;
  border-radius: 26px;
  padding: 40px 20px;
  cursor: pointer;
  transition: .25s;
  min-height: 260px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.card:hover {
  transform: translateY(-8px);
  border-color: #0b4fa8;
  box-shadow: 0 18px 35px rgba(11,79,168,.18);
}

.card.active {
  border-color: #991b1b;
  background: #fff7f7;
}

.icon {
  width: 95px;
  height: 95px;
  margin: 0 auto 18px;
  background: #f1f5f9;
  border-radius: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 46px;
}

.card h3 {
  font-size: 38px;
  margin: 8px 0;
  color: #991b1b;
}

.card p {
  font-size: 22px;
  color: #475569;
}

.screen {
  display: none;
}

.screen.active {
  display: block;
}

.selected {
  max-width: 520px;
  margin: 0 auto 25px;
  padding: 18px;
  background: #eff6ff;
  color: #0b4fa8;
  border: 2px solid #0b4fa8;
  border-radius: 18px;
  font-size: 24px;
  font-weight: bold;
}

.form-box {
  max-width: 480px;
  margin: auto;
}

input {
  width: 100%;
  padding: 18px;
  margin: 10px 0;
  border-radius: 14px;
  border: 2px solid #cbd5e1;
  font-size: 20px;
  outline: none;
}

input:focus {
  border-color: #0b4fa8;
}

button {
  width: 100%;
  padding: 18px;
  margin-top: 14px;
  border: none;
  border-radius: 14px;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}

.primary {
  background: #0b4fa8;
  color: white;
}

.back {
  background: #64748b;
  color: white;
}

#respuesta {
  margin-top: 22px;
  font-size: 22px;
  font-weight: bold;
  color: green;
}

@media (max-width: 900px) {
  .cards {
    grid-template-columns: 1fr;
  }

  h2 {
    font-size: 38px;
  }

  .header h1 {
    font-size: 30px;
  }
}
</style>
</head>

<body>

<div class="header">
  <div class="logo-box">
    <img src="LOGO.png" alt="CODISA">
  </div>
  <div>
    <h1>Sistema de Turnos</h1>
    <p>CODISA MONTERREY</p>
  </div>
</div>

<div class="container">

  <div id="pantallaOpciones" class="screen active">
    <h2>Bienvenido/a a <span>CODISA MONTERREY</span></h2>
    <p class="subtitle">Selecciona el tipo de atención que necesitas.</p>

    <div class="cards">
      <div class="card" onclick="seleccionar(this, 'Mayoreo', 'Más de 12 piezas')">
        <div class="icon">🧺</div>
        <h3>Mayoreo</h3>
        <p>Más de 12 piezas</p>
      </div>

      <div class="card" onclick="seleccionar(this, 'Menudeo', '11 piezas o menos')">
        <div class="icon">🛍️</div>
        <h3>Menudeo</h3>
        <p>11 piezas o menos</p>
      </div>

      <div class="card" onclick="seleccionar(this, 'Modificar', 'Modificar pedido')">
        <div class="icon">🔁</div>
        <h3>Modificar</h3>
        <p>Modificar pedido</p>
      </div>
    </div>
  </div>

  <div id="pantallaDatos" class="screen">
    <h2>Datos del cliente</h2>
    <p class="subtitle">Ingresa tu información para generar tu turno.</p>

    <div class="selected" id="tipoSel"></div>

    <div class="form-box">
      <input id="nombre"
             name="codisa_nombre_unico_987"
             placeholder="Nombre completo"
             autocomplete="new-password"
             autocorrect="off"
             autocapitalize="off"
             spellcheck="false">

      <input id="whatsapp"
             name="codisa_whatsapp_unico_987"
             placeholder="WhatsApp"
             autocomplete="new-password"
             inputmode="numeric"
             autocorrect="off"
             autocapitalize="off"
             spellcheck="false">

      <button class="primary" onclick="crearTurno()">Generar turno</button>
      <button class="back" onclick="volver()">Regresar</button>

      <div id="respuesta"></div>
    </div>
  </div>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzDYLpODTA6VX5PmAIWMwlpJ78bQV0wI3i8Ep28zaHHGsbaGlXONKlYNVI8nh38lMG2/exec";

let tipo = "";
let descripcion = "";
let ticketHTML = "";

function seleccionar(elemento, t, d) {
  tipo = t;
  descripcion = d;

  document.querySelectorAll(".card").forEach(card => card.classList.remove("active"));
  elemento.classList.add("active");

  document.getElementById("tipoSel").innerText = t + " - " + d;
  document.getElementById("respuesta").innerText = "";

  document.getElementById("pantallaOpciones").classList.remove("active");
  document.getElementById("pantallaDatos").classList.add("active");

  setTimeout(() => document.getElementById("nombre").focus(), 300);
}

function volver() {
  document.getElementById("pantallaDatos").classList.remove("active");
  document.getElementById("pantallaOpciones").classList.add("active");
  document.getElementById("respuesta").innerText = "";
}

function crearTurno() {
  const nombre = document.getElementById("nombre").value.trim();
  const whatsapp = document.getElementById("whatsapp").value.trim();

  if (!nombre || !whatsapp) {
    document.getElementById("respuesta").innerText = "Completa nombre y WhatsApp";
    return;
  }

  const callback = "cb_" + Date.now();

  window[callback] = function(data) {
    if (data.ok) {
      const fecha = new Date().toLocaleString("es-MX");

      ticketHTML = `
        <div style="text-align:center;font-family:Arial;width:260px;margin:auto;">
          <img src="LOGO.png" width="70"><br>
          <b>CODISA MONTERREY</b>
          <p>Tu turno</p>
          <div style="font-size:64px;font-weight:bold;color:#991b1b;">${data.ticket.turno}</div>
          <p><b>${data.ticket.tipo}</b></p>
          <p>${descripcion}</p>
          <p>${fecha}</p>
          <p>Espere a que su turno aparezca en pantalla.</p>
        </div>
      `;

      document.getElementById("respuesta").innerText = "Turno generado correctamente";

      document.getElementById("nombre").value = "";
      document.getElementById("whatsapp").value = "";

      imprimir();

      setTimeout(() => {
        volver();
      }, 1200);
    } else {
      document.getElementById("respuesta").innerText = "Error al generar turno";
    }

    delete window[callback];
    document.body.removeChild(script);
  };

  const script = document.createElement("script");
  script.src = SCRIPT_URL
    + "?action=create"
    + "&cliente=" + encodeURIComponent(nombre)
    + "&whatsapp=" + encodeURIComponent(whatsapp)
    + "&tipo=" + encodeURIComponent(tipo)
    + "&descripcion=" + encodeURIComponent(descripcion)
    + "&callback=" + callback;

  document.body.appendChild(script);
}

function imprimir() {
  const w = window.open("", "", "width=320,height=450");

  w.document.write(`
    <html>
    <head>
      <title>Ticket CODISA MONTERREY</title>
      <style>
        body {
          margin: 0;
          padding: 15px;
          text-align: center;
          font-family: Arial, sans-serif;
        }

        p {
          margin: 6px 0;
          font-size: 13px;
        }
      </style>
    </head>
    <body onload="window.print(); setTimeout(() => window.close(), 600);">
      ${ticketHTML}
    </body>
    </html>
  `);

  w.document.close();
}
</script>

</body>
</html>
