<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CODISA - Sistema de Turnos</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #0f172a;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 30px 45px;
    }

    .logo {
      width: 120px;
      height: 120px;
      border: 4px solid #0b4fa8;
      border-radius: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #0b4fa8;
      font-size: 24px;
      background: white;
    }

    .header h1 {
      margin: 0;
      font-size: 44px;
      color: #0b4fa8;
    }

    .header p {
      margin: 8px 0 0;
      font-size: 26px;
      color: #6b7280;
    }

    .container {
      background: white;
      margin: 0 42px 40px;
      padding: 55px 45px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      text-align: center;
    }

    h2 {
      font-size: 64px;
      margin: 0;
      color: #0b4fa8;
    }

    .subtitle {
      font-size: 26px;
      color: #6b7280;
      margin: 15px 0 50px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
    }

    .card {
      border: 2px solid #e5e7eb;
      border-radius: 28px;
      padding: 55px 25px;
      cursor: pointer;
      transition: 0.2s;
      background: white;
    }

    .card:hover {
      border-color: #0b4fa8;
      box-shadow: 0 12px 30px rgba(11,79,168,0.15);
      transform: translateY(-4px);
    }

    .icon {
      width: 138px;
      height: 138px;
      margin: 0 auto 25px;
      border-radius: 28px;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
    }

    .card h3 {
      font-size: 46px;
      margin: 0;
      color: #8b1717;
    }

    .card p {
      font-size: 26px;
      color: #6b7280;
      margin-bottom: 0;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .selected-box {
      background: #eff6ff;
      border: 2px solid #0b4fa8;
      border-radius: 18px;
      padding: 18px;
      margin: 25px auto;
      max-width: 520px;
      font-size: 24px;
      color: #0b4fa8;
      font-weight: bold;
    }

    .form {
      max-width: 520px;
      margin: 0 auto;
    }

    input {
      width: 100%;
      padding: 18px;
      margin: 10px 0;
      border: 2px solid #d1d5db;
      border-radius: 14px;
      font-size: 22px;
    }

    button {
      width: 100%;
      padding: 18px;
      margin-top: 15px;
      border: none;
      border-radius: 14px;
      background: #0b4fa8;
      color: white;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
    }

    .back {
      background: #6b7280;
    }

    #respuesta {
      margin-top: 25px;
      font-size: 24px;
      font-weight: bold;
      color: #15803d;
    }

    @media (max-width: 900px) {
      .cards { grid-template-columns: 1fr; }
      h2 { font-size: 42px; }
      .header h1 { font-size: 32px; }
      .header p { font-size: 20px; }
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">CODISA</div>
    <div>
      <h1>Sistema de Turnos</h1>
      <p>Registro rápido para clientes</p>
    </div>
  </div>

  <div class="container">

    <div id="pantallaOpciones" class="screen active">
      <h2>Bienvenido/a</h2>
      <p class="subtitle">Selecciona el tipo de atención que necesitas.</p>

      <div class="cards">
        <div class="card" onclick="seleccionarServicio('Mayoreo', 'Más de 12 piezas')">
          <div class="icon">🧺</div>
          <h3>Mayoreo</h3>
          <p>Más de 12 piezas</p>
        </div>

        <div class="card" onclick="seleccionarServicio('Menudeo', '11 piezas o menos')">
          <div class="icon">🛍️</div>
          <h3>Menudeo</h3>
          <p>11 piezas o menos</p>
        </div>

        <div class="card" onclick="seleccionarServicio('Modificar', 'Modificar pedido')">
          <div class="icon">🔁</div>
          <h3>Modificar</h3>
          <p>Modificar pedido</p>
        </div>
      </div>
    </div>

    <div id="pantallaDatos" class="screen">
      <h2>Datos del cliente</h2>
      <p class="subtitle">Ingresa tu información para generar el turno.</p>

      <div class="selected-box" id="servicioTexto"></div>

      <div class="form">
        <input id="nombre" placeholder="Nombre completo">
        <input id="whatsapp" placeholder="WhatsApp">

        <button onclick="crearTurno()">Generar turno</button>
        <button class="back" onclick="volver()">Regresar</button>
      </div>

      <div id="respuesta"></div>
    </div>

  </div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzQO4L8XprFWZTVfRcUZuol95NFa5MOKvZP9_EUY8bFTFx0NArHq-dTbViVSP-f-qI8/exec";

let servicioSeleccionado = "";
let descripcionSeleccionada = "";

function seleccionarServicio(servicio, descripcion) {
  servicioSeleccionado = servicio;
  descripcionSeleccionada = descripcion;

  document.getElementById("servicioTexto").innerHTML =
    servicio + " - " + descripcion;

  document.getElementById("pantallaOpciones").classList.remove("active");
  document.getElementById("pantallaDatos").classList.add("active");
}

function volver() {
  document.getElementById("pantallaDatos").classList.remove("active");
  document.getElementById("pantallaOpciones").classList.add("active");
  document.getElementById("respuesta").innerHTML = "";
}

function crearTurno() {
  const nombre = document.getElementById("nombre").value.trim();
  const whatsapp = document.getElementById("whatsapp").value.trim();

  if (!nombre || !whatsapp) {
    document.getElementById("respuesta").innerHTML = "Escribe nombre y WhatsApp";
    return;
  }

  const url = SCRIPT_URL
    + "?action=create"
    + "&cliente=" + encodeURIComponent(nombre)
    + "&whatsapp=" + encodeURIComponent(whatsapp)
    + "&tipo=" + encodeURIComponent(servicioSeleccionado)
    + "&descripcion=" + encodeURIComponent(descripcionSeleccionada);

  fetch(url, { mode: "no-cors" })
    .then(() => {
      document.getElementById("respuesta").innerHTML =
        "Turno generado correctamente";

      document.getElementById("nombre").value = "";
      document.getElementById("whatsapp").value = "";

      setTimeout(() => {
        volver();
      }, 1500);
    })
    .catch(() => {
      document.getElementById("respuesta").innerHTML =
        "Error al generar turno";
    });
}
</script>

</body>
</html>
